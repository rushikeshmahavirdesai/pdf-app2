<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Katina Print</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main>
    <h1>Katina Print</h1>
    <p class="hint">Paste a Katina article URL, then download PDF or print CSS.</p>
    <label for="url">Article URL</label>
    <input
      id="url"
      type="url"
      placeholder="https://katinamagazine.org/content/article/..."
      spellcheck="false"
    />
    <div class="actions">
      <button type="button" id="btn-pdf">Download PDF</button>
      <a id="btn-css" href="/katina-print.css" download="katina-print.css">Download CSS</a>
    </div>
    <p id="status" class="status" aria-live="polite"></p>
  </main>
  <script src="/app.js"></script>
</body>
</html>
