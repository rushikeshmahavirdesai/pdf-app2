[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@sparticuz/chromium"]

[functions.generate-pdf]
  timeout = 26
  included_files = ["public/katina-print.css"]

[dev]
  port = 8888
  publish = "public"
  functions = "netlify/functions"
  framework = "#static"
  autoLaunch = false
